name: Deploy to STRATO

on:
  workflow_dispatch:

concurrency:
  group: strato-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: quiz_hero_audit_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y lftp php-cli php-mysql php-mbstring rsync

      - name: Validate PHP
        run: |
          php -l api/bootstrap.php
          php -l api/user-sessions.php
          php -l api/index.php
          php -l database/migrate.php
          php -l database/seed-from-json.php

      - name: Validate JavaScript
        run: |
          node --check js/admin.js
          node --check js/account-page.js
          node --check js/login-page.js
          node --check js/quiz-data-service.js
          node --check js/user-service.js
          node --check js/quiz-controller.js
          node --check js/quiz-view.js
          node --check js/dialog.js
          node --check js/form-guard.js
          node --check js/round-storage.js
          node --check js/quiz-state.js

      - name: Build CSS and test contracts
        run: |
          node scripts/build-css.js
          node --test tests/contracts.test.mjs

      - name: Test migrations and account lifecycle
        env:
          QUIZ_HERO_DB_HOST: 127.0.0.1
          QUIZ_HERO_DB_PORT: 3306
          QUIZ_HERO_DB_NAME: quiz_hero_audit_ci
          QUIZ_HERO_DB_USER: root
          QUIZ_HERO_DB_PASSWORD: ci-test-only
        run: php tests/integration.php

      - name: Validate SEO configuration
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SEO_EXPORT_TOKEN: ${{ secrets.QUIZ_HERO_SEO_EXPORT_TOKEN }}
        run: |
          test -n "$SITE_URL" || { echo "::error::SITE_URL fehlt"; exit 1; }
          test -n "$SEO_EXPORT_TOKEN" || { echo "::error::SEO_EXPORT_TOKEN fehlt"; exit 1; }

      - name: Build SEO pages
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SEO_EXPORT_URL: ${{ secrets.SITE_URL }}/api/index.php?action=seo-export&v=1
          SEO_EXPORT_TOKEN: ${{ secrets.QUIZ_HERO_SEO_EXPORT_TOKEN }}
          QUIZ_HERO_API_VERSION: "1"
        run: node scripts/build-seo-pages.js

      - name: Prepare deploy directory
        run: |
          rm -rf deploy
          mkdir -p deploy
          rsync -a index.html login.html account.html styles.css .htaccess .user.ini 404.html version.json deploy/
          rsync -a admin api content data fonts images js deploy/
          rsync -a .build/seo/kategorie .build/seo/robots.txt .build/seo/sitemap.xml .build/seo/seo-manifest.json deploy/
          rm -f deploy/api/config.local.example.php

      - name: Apply asset version
        run: node scripts/apply-asset-version.js "${GITHUB_SHA::8}" deploy

      - name: Write deploy version
        run: |
          cat > deploy/version.json <<EOF
          {
            "version": "${GITHUB_SHA::8}",
            "commit": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "deployedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Write production PHP config
        env:
          QUIZ_HERO_DB_HOST: ${{ secrets.QUIZ_HERO_DB_HOST }}
          QUIZ_HERO_DB_PORT: ${{ secrets.QUIZ_HERO_DB_PORT }}
          QUIZ_HERO_DB_NAME: ${{ secrets.QUIZ_HERO_DB_NAME }}
          QUIZ_HERO_DB_USER: ${{ secrets.QUIZ_HERO_DB_USER }}
          QUIZ_HERO_DB_PASSWORD: ${{ secrets.QUIZ_HERO_DB_PASSWORD }}
          QUIZ_HERO_ADMIN_USER: ${{ secrets.QUIZ_HERO_ADMIN_USER }}
          QUIZ_HERO_ADMIN_PASSWORD_HASH: ${{ secrets.QUIZ_HERO_ADMIN_PASSWORD_HASH }}
          QUIZ_HERO_USER_TOKEN_SECRET: ${{ secrets.QUIZ_HERO_USER_TOKEN_SECRET }}
          QUIZ_HERO_SEO_EXPORT_TOKEN: ${{ secrets.QUIZ_HERO_SEO_EXPORT_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          QUIZ_HERO_MAIL_FROM: ${{ secrets.QUIZ_HERO_MAIL_FROM || 'helden@quiz-hero.de' }}
          QUIZ_HERO_FEEDBACK_NOTIFY_EMAIL: ${{ secrets.QUIZ_HERO_FEEDBACK_NOTIFY_EMAIL || secrets.QUIZ_HERO_SMTP_USER || secrets.QUIZ_HERO_REGISTRATION_NOTIFY_EMAIL || secrets.QUIZ_HERO_MAIL_FROM || 'helden@quiz-hero.de' }}
          QUIZ_HERO_MAIL_TRANSPORT: ${{ secrets.QUIZ_HERO_MAIL_TRANSPORT || 'smtp' }}
          QUIZ_HERO_SMTP_HOST: ${{ secrets.QUIZ_HERO_SMTP_HOST }}
          QUIZ_HERO_SMTP_PORT: ${{ secrets.QUIZ_HERO_SMTP_PORT || '587' }}
          QUIZ_HERO_SMTP_SECURE: ${{ secrets.QUIZ_HERO_SMTP_SECURE || 'tls' }}
          QUIZ_HERO_SMTP_USER: ${{ secrets.QUIZ_HERO_SMTP_USER }}
          QUIZ_HERO_SMTP_PASSWORD: ${{ secrets.QUIZ_HERO_SMTP_PASSWORD }}
          QUIZ_HERO_ALLOW_DEV_ACCOUNT_LOGIN: "false"
        run: |
          php -r '
          $keys = [
              "QUIZ_HERO_DB_HOST",
              "QUIZ_HERO_DB_PORT",
              "QUIZ_HERO_DB_NAME",
              "QUIZ_HERO_DB_USER",
              "QUIZ_HERO_DB_PASSWORD",
              "QUIZ_HERO_ADMIN_USER",
              "QUIZ_HERO_ADMIN_PASSWORD_HASH",
              "QUIZ_HERO_USER_TOKEN_SECRET",
              "QUIZ_HERO_SEO_EXPORT_TOKEN",
              "SITE_URL",
              "QUIZ_HERO_MAIL_FROM",
              "QUIZ_HERO_FEEDBACK_NOTIFY_EMAIL",
              "QUIZ_HERO_MAIL_TRANSPORT",
              "QUIZ_HERO_SMTP_HOST",
              "QUIZ_HERO_SMTP_PORT",
              "QUIZ_HERO_SMTP_SECURE",
              "QUIZ_HERO_SMTP_USER",
              "QUIZ_HERO_SMTP_PASSWORD",
              "QUIZ_HERO_ALLOW_DEV_ACCOUNT_LOGIN",
          ];
          $config = [];
          foreach ($keys as $key) {
              $config[$key] = getenv($key) ?: "";
          }
          file_put_contents("deploy/api/config.local.php", "<?php\n\ndeclare(strict_types=1);\n\nreturn " . var_export($config, true) . ";\n");
          '

      - name: Validate deployment secrets
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          STRATO_SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          STRATO_SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          STRATO_SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD || secrets.SECRET_STRATO_QUIZHERO }}
          STRATO_TARGET_PATH: ${{ secrets.STRATO_TARGET_PATH }}
          QUIZ_HERO_DB_HOST: ${{ secrets.QUIZ_HERO_DB_HOST }}
          QUIZ_HERO_DB_PORT: ${{ secrets.QUIZ_HERO_DB_PORT }}
          QUIZ_HERO_DB_NAME: ${{ secrets.QUIZ_HERO_DB_NAME }}
          QUIZ_HERO_DB_USER: ${{ secrets.QUIZ_HERO_DB_USER }}
          QUIZ_HERO_DB_PASSWORD: ${{ secrets.QUIZ_HERO_DB_PASSWORD }}
          QUIZ_HERO_ADMIN_USER: ${{ secrets.QUIZ_HERO_ADMIN_USER }}
          QUIZ_HERO_ADMIN_PASSWORD_HASH: ${{ secrets.QUIZ_HERO_ADMIN_PASSWORD_HASH }}
          QUIZ_HERO_MAIL_TRANSPORT: ${{ secrets.QUIZ_HERO_MAIL_TRANSPORT || 'smtp' }}
          QUIZ_HERO_SMTP_HOST: ${{ secrets.QUIZ_HERO_SMTP_HOST }}
          QUIZ_HERO_SMTP_USER: ${{ secrets.QUIZ_HERO_SMTP_USER }}
          QUIZ_HERO_SMTP_PASSWORD: ${{ secrets.QUIZ_HERO_SMTP_PASSWORD }}
        run: |
          missing=0
          for key in SITE_URL STRATO_SFTP_HOST STRATO_SFTP_USER STRATO_SFTP_PASSWORD STRATO_TARGET_PATH QUIZ_HERO_DB_HOST QUIZ_HERO_DB_PORT QUIZ_HERO_DB_NAME QUIZ_HERO_DB_USER QUIZ_HERO_DB_PASSWORD QUIZ_HERO_ADMIN_USER QUIZ_HERO_ADMIN_PASSWORD_HASH; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is missing or empty"
              missing=1
            fi
          done
          if [ "$QUIZ_HERO_MAIL_TRANSPORT" = "smtp" ]; then
            for key in QUIZ_HERO_SMTP_HOST QUIZ_HERO_SMTP_USER QUIZ_HERO_SMTP_PASSWORD; do
              if [ -z "${!key}" ]; then
                echo "::error::$key is required when QUIZ_HERO_MAIL_TRANSPORT=smtp"
                missing=1
              fi
            done
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy via SFTP
        env:
          STRATO_SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          STRATO_SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          STRATO_SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD || secrets.SECRET_STRATO_QUIZHERO }}
          STRATO_TARGET_PATH: ${{ secrets.STRATO_TARGET_PATH }}
        run: |
          lftp -u "$STRATO_SFTP_USER","$STRATO_SFTP_PASSWORD" "sftp://$STRATO_SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          mirror --reverse --verbose --exclude-glob kategorie/ deploy/ "$STRATO_TARGET_PATH"
          mirror --reverse --delete --verbose deploy/kategorie/ "$STRATO_TARGET_PATH/kategorie"
          bye
          EOF

      - name: Verify production version
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          expected="${GITHUB_SHA::8}"
          url="${SITE_URL%/}/version.json?verify=$expected"
          for attempt in 1 2 3 4 5 6; do
            echo "Checking $url (attempt $attempt)"
            body="$(curl -fsS -H 'Cache-Control: no-cache' "$url" || true)"
            echo "$body"
            if echo "$body" | grep -q "\"version\": \"$expected\""; then
              echo "Production version verified: $expected"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production did not return version $expected from $url"
          exit 1

      - name: Verify published SEO pages
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/verify-seo.js .build/seo/seo-manifest.json
