<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Quiz-Hero Login</title>
    <link rel="icon" type="image/png" href="/images/website/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="stylesheet" href="fonts/fonts.css?v=dev" />
    <link rel="stylesheet" href="styles.css?v=dev" />
</head>
<body>
    <main class="container login-page">
        <header class="main-header">
            <a class="main-header__logo-link" href="index.html" title="Zur Startseite">
                <img class="main-header__image" src="images/website/avatar/logo.png" alt="Zur Startseite" loading="eager">
            </a>
            <h1 class="main-header__headline" tabindex="-1">Quiz-Hero</h1>
        </header>

        <section class="login-shell" aria-live="polite">
            <div class="login-shell__header">
                <h2>Account</h2>
                <p>Einloggen oder einen neuen Helden erstellen.</p>
            </div>

            <div class="tabs login-shell__tabs" role="group" aria-label="Account">
                <button class="tab js-login-tab" type="button" data-login-view="login" >Einloggen</button>
                <button class="tab js-login-tab" type="button" data-login-view="register" >Registrieren</button>
            </div>

            <form id="js-login-form" class="user-panel__form login-panel login-panel--login js-login-panel" data-login-panel="login">
                <label>
                    <span>E-Mail oder Username*</span>
                    <input id="js-login-identifier" type="text" maxlength="190" autocomplete="username" required>
                </label>
                <label>
                    <span>Passwort*</span>
                    <input id="js-login-password" type="password" autocomplete="current-password" required>
                </label>
                <div class="login-panel__actions">
                    <button class="btn btn--modal login-panel__submit" type="submit">Einloggen</button>
                    <div class="login-panel__secondary-actions">
                        <button class="account-action-link login-shell__forgot js-login-tab" type="button" data-login-view="reset-request">Passwort vergessen?</button>
                        <button id="js-login-dev" class="account-action-link login-panel__dev u-hidden" type="button">Lokal testen</button>
                    </div>
                </div>
            </form>

            <form id="js-register-form" class="user-panel__form login-panel login-panel--register js-login-panel u-hidden" data-login-panel="register">
                <label>
                    <span>Username*</span>
                    <input id="js-register-username" type="text" maxlength="25" autocomplete="username" required>
                </label>
                <label>
                    <span>E-Mail*</span>
                    <input id="js-register-email" type="email" maxlength="190" autocomplete="email" required>
                </label>
                <label>
                    <span>Passwort*</span>
                    <input id="js-register-password" type="password" minlength="10" autocomplete="new-password" required>
                </label>
                <div class="account-avatar-field js-login-avatar-group" data-avatar-target="register">
                    <p class="account-avatar-field__title">Wähle dein Heldenbild</p>
                </div>
                <label class="account-checkbox">
                    <input id="js-register-privacy" type="checkbox" required>
                    <span>Ich habe die <a href="#" class="js-footer-modal-link" data-footer-modal-url="content/datenschutz.html">Datenschutzhinweise</a> gelesen und möchte einen Quiz-Hero Account erstellen.*</span>
                </label>
                <button class="btn btn--modal login-panel__submit" type="submit">Registrieren</button>
            </form>

            <form id="js-reset-request-form" class="user-panel__form login-panel login-panel--reset js-login-panel u-hidden" data-login-panel="reset-request">
                <div class="login-panel__intro">
                    <h2>Passwort zurücksetzen</h2>
                    <p>Du bekommst einen Link, wenn die E-Mail bekannt ist.</p>
                </div>
                <label>
                    <span>E-Mail*</span>
                    <input id="js-reset-email" type="email" maxlength="190" autocomplete="email" required>
                </label>
                <button class="btn btn--modal login-panel__submit" type="submit">Reset-Link senden</button>
                <button class="account-action-link js-login-tab" type="button" data-login-view="login">Zurück zum Login</button>
            </form>

            <form id="js-reset-form" class="user-panel__form login-panel login-panel--reset js-login-panel u-hidden" data-login-panel="reset">
                <input id="js-reset-token" type="hidden">
                <label>
                    <span>Neues Passwort*</span>
                    <input id="js-reset-password" type="password" minlength="10" autocomplete="new-password" required>
                </label>
                <button class="btn btn--modal login-panel__submit" type="submit">Passwort speichern</button>
            </form>

            <details class="login-resend">
                <summary>Bestätigungsmail fehlt oder Link abgelaufen?</summary>
                <form id="js-resend-form" class="login-panel">
                    <label>E-Mail-Adresse <input id="js-resend-email" type="email" autocomplete="email" required maxlength="190"></label>
                    <button class="btn" type="submit">Bestätigung erneut senden</button>
                </form>
            </details>
            <p id="js-login-status" class="user-panel__status" role="status" aria-live="polite"></p>
        </section>

        <p class="account-page__back">
            <a href="index.html">Zurück zum Quiz</a>
        </p>
    </main>

    <footer class="footer">
        <p class="footer__text">
            <small>
                <a href="#" class="js-footer-modal-link" data-footer-modal-url="content/impressum.html">Impressum</a> |
                <a href="#" class="js-footer-modal-link" data-footer-modal-url="content/datenschutz.html">Datenschutz</a> |
                <a href="#" class="js-footer-modal-link" data-footer-modal-url="content/cookies.html">Cookies</a>
            </small>
        </p>
    </footer>

    <dialog id="js-footer-modal" class="modal u-hidden" role="dialog" aria-modal="true">
        <div class="modal__content">
            <div class="modal__close">
                <button id="js-footer-modal-close" class="modal__close-button icon-button" type="button" aria-label="Modal schließen">
                    <svg class="icon-button__icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="m12 10.93 5.719-5.72c.146-.146.339-.219.531-.219.404 0 .75.324.75.749 0 .193-.073.385-.219.532l-5.72 5.719 5.719 5.719c.147.147.22.339.22.531 0 .427-.349.75-.75.75-.192 0-.385-.073-.531-.219l-5.719-5.719-5.719 5.719c-.146.146-.339.219-.531.219-.401 0-.75-.323-.75-.75 0-.192.073-.384.22-.531l5.719-5.719-5.72-5.719c-.146-.147-.219-.339-.219-.532 0-.425.346-.749.75-.749.192 0 .385.073.531.219z"/>
                    </svg>
                </button>
            </div>
            <div id="js-footer-modal-content"></div>
        </div>
    </dialog>

    <script type="module" src="js/login-page.js?v=dev"></script>
</body>
</html>
