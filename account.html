<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Quiz-Hero Heldenseite</title>
    <link rel="icon" type="image/png" href="/images/website/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="stylesheet" href="fonts/fonts.css?v=dev" />
    <link rel="stylesheet" href="styles.css?v=dev" />
</head>
<body>
    <main class="container account-page">
        <header class="main__header">
            <a class="main__logo-link" href="index.html" title="Zur Startseite">
                <img class="main_image" src="images/website/avatar/logo.png" alt="Zur Startseite" loading="eager">
            </a>
            <h1 class="main_headline">Heldenseite</h1>
        </header>

        <section class="account-shell" aria-live="polite">
            <div id="js-account-page-logged-out" class="account-empty admin-hidden">
                <h2>Du bist nicht angemeldet.</h2>
                <p>Melde dich an, um deine Heldenseite zu verwalten.</p>
                <a class="btn btn--modal" href="index.html">Zur Anmeldung</a>
            </div>

            <div id="js-account-page-content" class="admin-hidden">
                <div class="account-profile-card">
                    <button id="js-account-avatar-open" class="account-profile-card__avatar" type="button">
                        <img id="js-account-avatar-image" src="images/website/avatar/quizo.png" alt="Profilbild" loading="eager">
                        <span>Bild ändern</span>
                    </button>
                    <div class="account-profile-card__body">
                        <h2 id="js-account-profile-name">Profil</h2>
                        <p id="js-account-profile-email"></p>
                    </div>
                </div>

                <form id="js-account-page-form" class="account-page-form">
                    <h2 class="account-page-form__headline">Zugangsdaten</h2>
                    <label>
                        <span>Username</span>
                        <input id="js-account-page-username" type="text" maxlength="25" autocomplete="username" required>
                    </label>
                    <label>
                        <span>Neues Passwort</span>
                        <input id="js-account-page-password" type="password" minlength="10" autocomplete="new-password" placeholder="leer lassen, wenn unverändert">
                    </label>
                    <div class="account-page-form__actions">
                        <button class="btn btn--modal account-page-form__save" type="submit">Profil speichern</button>
                        <div class="account-page-form__secondary-actions">
                            <button id="js-account-page-logout" class="account-action-link" type="button">Abmelden</button>
                            <button id="js-account-page-delete" class="account-action-link account-action-link--danger" type="button">Account löschen</button>
                        </div>
                    </div>
                </form>
            </div>

            <p id="js-account-page-status" class="user-panel__status" role="status" aria-live="polite"></p>
        </section>

        <p class="account-page__back">
            <a href="index.html">Zurück zum Quiz</a>
        </p>
    </main>

    <footer class="footer">
        <p class="footer__text">
            <small>
                <a href="#" class="js-footer-modal-link" data-footer-modal-url="content/impressum.html">Impressum</a> |
                <a href="#" class="js-footer-modal-link" data-footer-modal-url="content/datenschutz.html">Datenschutz</a> |
                <a href="#" class="js-footer-modal-link" data-footer-modal-url="content/cookies.html">Cookies</a>
            </small>
        </p>
    </footer>

    <section id="js-footer-modal" class="modal hide" role="dialog" aria-modal="true">
        <div class="modal__content">
            <div class="modal__close">
                <button id="js-footer-modal-close" class="modal__close_btn" type="button" aria-label="Modal schließen">
                    <svg class="quiz__abort_svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="m12 10.93 5.719-5.72c.146-.146.339-.219.531-.219.404 0 .75.324.75.749 0 .193-.073.385-.219.532l-5.72 5.719 5.719 5.719c.147.147.22.339.22.531 0 .427-.349.75-.75.75-.192 0-.385-.073-.531-.219l-5.719-5.719-5.719 5.719c-.146.146-.339.219-.531.219-.401 0-.75-.323-.75-.75 0-.192.073-.384.22-.531l5.719-5.719-5.72-5.719c-.146-.147-.219-.339-.219-.532 0-.425.346-.749.75-.749.192 0 .385.073.531.219z"/>
                    </svg>
                </button>
            </div>
            <div id="js-footer-modal-content"></div>
        </div>
    </section>

    <section id="js-account-avatar-modal" class="modal hide" role="dialog" aria-modal="true">
        <div class="modal__content">
            <div class="modal__close">
                <button id="js-account-avatar-close" class="modal__close_btn" type="button" aria-label="Modal schließen">
                    <svg class="quiz__abort_svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="m12 10.93 5.719-5.72c.146-.146.339-.219.531-.219.404 0 .75.324.75.749 0 .193-.073.385-.219.532l-5.72 5.719 5.719 5.719c.147.147.22.339.22.531 0 .427-.349.75-.75.75-.192 0-.385-.073-.531-.219l-5.719-5.719-5.719 5.719c-.146.146-.339.219-.531.219-.401 0-.75-.323-.75-.75 0-.192.073-.384.22-.531l5.719-5.719-5.72-5.719c-.146-.147-.219-.339-.219-.532 0-.425.346-.749.75-.749.192 0 .385.073.531.219z"/>
                    </svg>
                </button>
            </div>
            <div id="js-account-avatar-modal-content"></div>
        </div>
    </section>

    <script type="module" src="js/account-page.js?v=dev"></script>
</body>
</html>
